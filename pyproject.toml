[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deeprecover"
version = "0.10.1"
description = "Local mobile data workbench with read-only indexing and verified export"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3", "tzdata==2025.2; sys_platform == 'win32'"]

[project.scripts]
deeprecover = "app.bootstrap:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "storage*", "ui*"]

[tool.setuptools.package-data]
app = ["assets/*.mp4", "assets/*.pdf", "assets/*.txt"]
