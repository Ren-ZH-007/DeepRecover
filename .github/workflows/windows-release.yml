name: Windows and macOS build and release

on:
  push:
    branches: [feature/ui-refresh-release, feature/macos-support, feature/computer-recovery, fix/macos-apfs-preflight, feature/guided-recovery, feature/m5-readiness, feature/video-preview]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create isolated Python environment
        shell: pwsh
        run: python -m venv .venv
      - name: Diagnose synthetic Windows paths and stat APIs
        shell: pwsh
        run: .venv/Scripts/python.exe scripts/diagnose_windows_paths.py
      - name: Validate version and tag
        id: version
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test, compile, start executable and make ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Prepare pinned CJK font for offscreen screenshots
        shell: pwsh
        run: |
          # The offscreen plugin does not enumerate Windows system fonts.
          # Test-only OFL font; it is not included in the application ZIP.
          New-Item -ItemType Directory -Force build/qa-fonts | Out-Null
          $font = Join-Path (Get-Location) 'build/qa-fonts/NotoSansCJKsc-Regular.otf'
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $font
          if ((Get-FileHash -Algorithm SHA256 $font).Hash.ToLowerInvariant() -ne '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b') { throw 'QA font checksum mismatch' }
      - name: Computer recovery image workflows and screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ github.workspace }}/build/qa-fonts
        run: .venv/Scripts/python.exe scripts/computer_qa_capture.py --output build/computer-qa
      - name: Guided workspace workflows and screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ github.workspace }}/build/qa-fonts
        run: .venv/Scripts/python.exe scripts/guided_qa_capture.py --output build/guided-qa
      - name: Local environment diagnostics workflows and screenshots
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ github.workspace }}/build/qa-fonts
        run: .venv/Scripts/python.exe scripts/diagnostics_qa_capture.py --output build/diagnostics-qa
      - name: Actual local video playback and rejection workflows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: ${{ github.workspace }}/build/qa-fonts
        run: .venv/Scripts/python.exe scripts/video_qa_capture.py --output build/video-qa
      - name: Preserve test and executable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            build/test-report.json
            build/executable-smoke.json
            build/computer-qa/
            build/guided-qa/
            build/diagnostics-qa/
            build/video-qa/
          if-no-files-found: warn
      - name: Preserve complete distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-distribution
          path: |
            dist/DeepRecover-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  macos:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/macos-build.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-distribution
          path: release-assets/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-distribution
          path: release-assets/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-x86_64-distribution
          path: release-assets/macos-x86_64
      - name: Verify assets and publish the exact tested tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir publish-assets
          for platform in windows macos-arm64 macos-x86_64; do
            (cd "release-assets/$platform" && sha256sum --check SHA256SUMS.txt)
            cp release-assets/"$platform"/*.zip publish-assets/
            cat "release-assets/$platform/SHA256SUMS.txt" >> publish-assets/SHA256SUMS.txt
          done
          (cd publish-assets && sha256sum --check SHA256SUMS.txt)
          cp "docs/releases/${RELEASE_TAG#v}/RELEASE_NOTES.md" release-notes.md
          printf '\nBuild commit: `%s`\n' "$RELEASE_COMMIT" >> release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Refusing to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" publish-assets/*.zip publish-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "DeepRecover $RELEASE_TAG · Windows and macOS preview" \
            --notes-file release-notes.md --prerelease --verify-tag
