name: Windows x64 build and release

on:
  push:
    branches: [feature/ui-refresh-release]
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Create isolated Python environment
        shell: pwsh
        run: python -m venv .venv
      - name: Diagnose synthetic Windows paths and stat APIs
        shell: pwsh
        run: .venv/Scripts/python.exe scripts/diagnose_windows_paths.py
      - name: Validate version and tag
        id: version
        shell: pwsh
        run: |
          $version = (& .venv/Scripts/python.exe -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test, compile, start executable and make ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Preserve test and executable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-validation-${{ github.sha }}
          path: |
            build/test-report.json
            build/executable-smoke.json
          if-no-files-found: warn
      - name: Preserve complete distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-distribution
          path: |
            dist/DeepRecover-v${{ steps.version.outputs.version }}-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-distribution
          path: release-assets
      - name: Verify assets and publish the exact tested tag commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          cp docs/releases/0.2.0/RELEASE_NOTES.md release-notes.md
          printf '\nBuild commit: `%s`\n' "$RELEASE_COMMIT" >> release-notes.md
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag. Refusing to overwrite its assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "DeepRecover $RELEASE_TAG · Windows x64 preview" \
            --notes-file release-notes.md --prerelease --verify-tag
