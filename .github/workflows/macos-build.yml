name: macOS native app build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - 'storage/**'
      - 'ui/**'
      - 'tests/**'
      - 'scripts/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  macos:
    # Official runner-images README: macos-15 is arm64; macos-15-intel is x64.
    # Avoid deprecated macos-14 and moving macos-latest aliases.
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Native test, bundle, offscreen and Cocoa verification
        shell: bash
        run: bash scripts/build-macos.sh '${{ matrix.arch }}'
      - name: Validate native APFS metadata and same-disk rejection without raw reads
        shell: bash
        run: .venv/bin/python scripts/verify_macos_disk_metadata.py --report 'build/macos-${{ matrix.arch }}/disk-metadata-validation.json'
      - name: Detailed native Cocoa workflows and screenshots
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/qa_capture.py --output 'build/macos-${{ matrix.arch }}/qa'
      - name: Computer recovery image workflows and screenshots
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/computer_qa_capture.py --output 'build/macos-${{ matrix.arch }}/computer-qa'
      - name: Guided workspace workflows and screenshots
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/guided_qa_capture.py --output 'build/macos-${{ matrix.arch }}/guided-qa'
      - name: Local environment diagnostics workflows and screenshots
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/diagnostics_qa_capture.py --output 'build/macos-${{ matrix.arch }}/diagnostics-qa'
      - name: Actual local video playback and rejection workflows
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/video_qa_capture.py --output 'build/macos-${{ matrix.arch }}/video-qa'
      - name: Video signature scan, actual decode, verified export and history
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/video_signature_qa_capture.py --output 'build/macos-${{ matrix.arch }}/video-signature-qa'
      - name: Static PDF scan, isolated rendering, export and history
        shell: bash
        env:
          QT_QPA_PLATFORM: cocoa
        run: .venv/bin/python scripts/pdf_qa_capture.py --output 'build/macos-${{ matrix.arch }}/pdf-qa'
      - name: Preserve native validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-validation-${{ github.sha }}
          path: |
            build/macos-${{ matrix.arch }}/test-report.json
            build/macos-${{ matrix.arch }}/pdf-render-failure.pdf
            build/macos-${{ matrix.arch }}/*-smoke.json
            build/macos-${{ matrix.arch }}/*.stdout.txt
            build/macos-${{ matrix.arch }}/*.stderr.txt
            build/macos-${{ matrix.arch }}/cocoa-overview.png
            build/macos-${{ matrix.arch }}/codesign-*.log
            build/macos-${{ matrix.arch }}/bundle-validation.json
            build/macos-${{ matrix.arch }}/disk-metadata-validation.json
            build/macos-${{ matrix.arch }}/qa/
            build/macos-${{ matrix.arch }}/computer-qa/
            build/macos-${{ matrix.arch }}/guided-qa/
            build/macos-${{ matrix.arch }}/diagnostics-qa/
            build/macos-${{ matrix.arch }}/video-qa/
            build/macos-${{ matrix.arch }}/video-signature-qa/
            build/macos-${{ matrix.arch }}/pdf-qa/
          if-no-files-found: warn
      - name: Preserve complete native app distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}-distribution
          path: |
            dist/macos-${{ matrix.arch }}/DeepRecover-v*-macos-${{ matrix.arch }}.zip
            dist/macos-${{ matrix.arch }}/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
